<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Muri AI Demo</title>
<style>
  :root{
    --bg:#0b1220; --card:#121c30; --border:#22304a; --text:#eaf2fa;
    --muted:#8ea0bd; --accent:#5a69e8; --accent2:#2fd98a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 20%, #16223a 0%, var(--bg) 60%);
    font-family:'Segoe UI', Arial, sans-serif; color:var(--text); padding:32px;
  }
  .sidebar{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:28px 22px; width:260px; text-align:center; position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .avatar-wrap{ position:relative; width:120px; height:120px; margin:0 auto 14px; }
  .avatar-wrap img{
    width:120px; height:120px; border-radius:50%; object-fit:cover;
    border:3px solid var(--accent);
  }
  .muri-badge{
    position:absolute; top:-6px; right:-10px;
    background:linear-gradient(135deg,var(--accent),#8b96ff);
    color:#fff; font-size:11px; font-weight:800; letter-spacing:0.4px;
    padding:6px 10px; border-radius:999px; border:2px solid var(--bg);
    cursor:pointer; display:flex; align-items:center; gap:5px;
    box-shadow:0 6px 16px rgba(90,105,232,0.5);
    transition:transform .15s ease, box-shadow .15s ease;
    user-select:none;
  }
  .muri-badge:hover{ transform:translateY(-2px) scale(1.04); box-shadow:0 10px 22px rgba(90,105,232,0.65); }
  .muri-badge:active{ transform:translateY(0) scale(0.97); }
  .muri-badge svg{ width:13px; height:13px; }
  .name{ font-size:18px; font-weight:700; margin:4px 0 2px; }
  .role{ font-size:13px; color:var(--muted); margin-bottom:14px; }
  .hint{ font-size:12px; color:var(--muted); line-height:1.5; }
  .hint b{ color:var(--accent2); }

  /* Chat panel */
  .overlay{
    position:fixed; inset:0; background:rgba(4,8,16,0.55);
    display:none; align-items:center; justify-content:center; z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.open{ display:flex; }
  .chat{
    width:360px; max-width:92vw; max-height:86vh; background:var(--card);
    border:1px solid var(--border); border-radius:18px; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 30px 70px rgba(0,0,0,0.55);
    animation:pop .18s ease;
  }
  @keyframes pop{ from{ transform:scale(0.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .chat-head{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    background:linear-gradient(135deg,#1a2440,#111a30); border-bottom:1px solid var(--border);
  }
  .chat-head .dot{ width:9px;height:9px;border-radius:50%;background:var(--accent2); box-shadow:0 0 8px var(--accent2); }
  .chat-head .title{ font-weight:700; font-size:14px; flex:1; }
  .chat-head .close{
    cursor:pointer; color:var(--muted); background:none; border:none; font-size:18px; line-height:1;
  }
  .chat-head .close:hover{ color:var(--text); }
  .chat-body{ padding:16px; overflow-y:auto; flex:1; min-height:220px; }
  .bubble{
    max-width:88%; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.5;
    margin-bottom:10px; opacity:0; animation:fadeIn .25s ease forwards;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .bubble.bot{ background:#1b2748; border:1px solid var(--border); border-bottom-left-radius:4px; }
  .bubble.q{ background:linear-gradient(135deg,var(--accent),#7d8bff); margin-left:auto; border-bottom-right-radius:4px; }
  .typing{ display:flex; gap:4px; padding:10px 13px; }
  .typing span{ width:6px;height:6px;border-radius:50%; background:var(--muted); animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
  .chat-foot{ padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:8px; }
  .chat-foot button{
    flex:1; background:linear-gradient(135deg,var(--accent2),#22b374); color:#062018; border:none;
    font-weight:700; font-size:13px; padding:10px 12px; border-radius:10px; cursor:pointer;
    transition:transform .12s ease;
  }
  .chat-foot button:hover{ transform:translateY(-1px); }
  .chat-foot button:active{ transform:translateY(0); }
  .chat-foot .secondary{
    flex:none; background:transparent; color:var(--muted); border:1px solid var(--border);
  }
</style>
</head>

<script>
(function(){
  var questions = [
    { q: "What's the difference between a stack and a queue?",
      a: "A stack is LIFO — the last item you push is the first one you pop, like a stack of trays. A queue is FIFO — the first item in is the first one out, like a line at a canteen." },
    { q: "Can you explain what a foreign key does in a database?",
      a: "A foreign key links a row in one table to a row in another, keeping the relationship consistent — e.g. an 'enrollments' table using a student_id foreign key to reference the 'students' table." },
    { q: "What is the time complexity of binary search?",
      a: "O(log n). Each comparison cuts the remaining search space in half, so it scales very well even on large sorted datasets." },
    { q: "What's the point of the useEffect hook in React?",
      a: "It lets a component run side effects — like fetching data or subscribing to events — after render, and clean them up when the component unmounts or dependencies change." },
    { q: "What is normalization in database design?",
      a: "It's the process of organizing tables to reduce redundancy and avoid update anomalies, usually by splitting data into related tables (1NF, 2NF, 3NF, and so on)." },
    { q: "What's the difference between authentication and authorization?",
      a: "Authentication confirms who you are (logging in). Authorization determines what you're allowed to do once you're in (permissions, roles)." },
    { q: "How does a hash map achieve near O(1) lookups?",
      a: "It converts a key into an index using a hash function, so it can jump almost directly to the bucket holding the value instead of scanning every entry." },
    { q: "What is the purpose of an API gateway?",
      a: "It's a single entry point that routes client requests to the right backend services, and can also handle auth, rate limiting, and logging in one place." }
  ];

  var overlay = document.getElementById('overlay');
  var chatBody = document.getElementById('chatBody');
  var muriBtn = document.getElementById('muriBtn');
  var closeBtn = document.getElementById('closeBtn');
  var closeBtn2 = document.getElementById('closeBtn2');
  var nextBtn = document.getElementById('nextBtn');
  var lastIndex = -1;

  function pickQuestion(){
    var i;
    do { i = Math.floor(Math.random() * questions.length); } while (i === lastIndex && questions.length > 1);
    lastIndex = i;
    return questions[i];
  }

  function addBubble(text, cls){
    var b = document.createElement('div');
    b.className = 'bubble ' + cls;
    b.textContent = text;
    chatBody.appendChild(b);
    chatBody.scrollTop = chatBody.scrollHeight;
    return b;
  }

  function addTyping(){
    var t = document.createElement('div');
    t.className = 'bubble bot typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    chatBody.appendChild(t);
    chatBody.scrollTop = chatBody.scrollHeight;
    return t;
  }

  function askQuestion(){
    var item = pickQuestion();
    addBubble(item.q, 'q');
    var typing = addTyping();
    setTimeout(function(){
      typing.remove();
      addBubble(item.a, 'bot');
    }, 650 + Math.random() * 400);
  }

  function openChat(){
    overlay.classList.add('open');
    if (chatBody.children.length === 0) {
      addBubble("Hi! I'm Muri AI — pick a topic and I'll quiz you with a random question.", 'bot');
    }
    askQuestion();
  }

  function closeChat(){
    overlay.classList.remove('open');
  }

  muriBtn.addEventListener('click', openChat);
  closeBtn.addEventListener('click', closeChat);
  closeBtn2.addEventListener('click', closeChat);
  nextBtn.addEventListener('click', askQuestion);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeChat(); });
})();
</script>

</body>
</html>
